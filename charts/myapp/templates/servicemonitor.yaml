apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: myapp
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: myapp
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http   # debe coincidir con el name del port en tu Service
      path: /metrics
      interval: 15s
