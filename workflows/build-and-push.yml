name: Build and Publish
on:
push:
branches: [ main ]


permissions:
packages: write
contents: read


jobs:
build-push:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Set up Docker Buildx
uses: docker/setup-buildx-action@v2
- name: Login to GHCR
uses: docker/login-action@v2
with:
registry: ghcr.io
username: ${{ github.actor }}
password: ${{ secrets.GITHUB_TOKEN }}
- name: Build and push
uses: docker/build-push-action@v4
with:
context: ./app
push: true
tags: |
ghcr.io/${{ github.repository_owner }}/devops-showcase-app:latest
ghcr.io/${{ github.repository_owner }}/devops-showcase-app:${{ github.sha }}
